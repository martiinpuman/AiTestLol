<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Offboarding · Aurora ERP</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .tenant-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .tenant-head h1 { font-size: var(--font-size-heading-md); font-weight: 600; }
  .intro-panel { background: var(--color-info-muted); color: var(--color-info); border-radius: var(--radius-md); padding: var(--space-4); font-size: var(--font-size-small); }
  .cert-panel { padding: var(--space-4); }
  .gate-list { display: flex; flex-direction: column; gap: var(--space-2); font-size: 12px; }
</style>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="shell.skipToContent">Skip to main content</a>
<div class="shell shell-operator" id="shell">
  <header class="topbar topbar-operator">
    <div class="brand"><span class="mark">A</span> <span data-i18n="operator.brand">Aurora ERP · Operator Console</span></div>
    <div class="spacer"></div>
    <div class="theme-toggle">
      <button data-mode="light" onclick="setTheme('light')">Light</button>
      <button data-mode="dark" onclick="setTheme('dark')">Dark</button>
      <button data-mode="system" onclick="setTheme('system')">System</button>
    </div>
    <div class="operator-user"><span class="company-badge" style="--badge-color:#57616C">JA</span><span>J. Alvarez</span></div>
    <button class="btn btn-ghost btn-sm" data-i18n="operator.signOut">Sign out</button>
  </header>

  <main class="main">
    <div class="page" style="max-width:900px;">
      <div>
        <a class="btn btn-ghost btn-sm" id="back-link" href="tenant-detail.html" style="padding-left:0;"></a>
      </div>
      <div class="tenant-head">
        <h1 id="page-heading">—</h1>
      </div>

      <!-- Stage 0: not yet started -->
      <div class="intro-panel" id="intro-panel" hidden>
        <p data-i18n="tenants.offboarding.intro" style="margin-bottom:var(--space-3);"></p>
        <button class="btn btn-danger" id="begin-btn" onclick="openConfirm('begin')"></button>
      </div>

      <div class="vstepper" id="vstepper"></div>

      <!-- Stage-current content, injected per stage -->
      <div id="stage-content"></div>

    </div>
  </main>
  <div class="conn-banner" id="conn-banner" data-state="connected"></div>
</div>

<!-- Generic light confirmation (begin / resume / start export / cancel-deletion) -->
<div class="modal-overlay" id="confirm-modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="closeModal('confirm-modal')" data-i18n="tenants.destroy.cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-submit-btn" onclick="submitConfirm()"></button>
    </div>
  </div>
</div>

<!-- Permanent-delete dialog: the heaviest confirmation in the system -->
<div class="modal-overlay" id="delete-modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="delete-title" style="width:480px;">
    <h2 id="delete-title"></h2>

    <!-- Identity check #1 (on open) — gates whether the three operator
         gates below are even reachable. A SEPARATE, second check runs again
         at submit (see submitPermanentDelete) — see spec, "Detection, not
         prevention": the two checks are never the same round trip. -->
    <div id="delete-identity-checking" role="status" aria-live="polite"></div>
    <div id="delete-identity-confirmed" class="field-foot" style="color:var(--color-success);" hidden></div>
    <div id="delete-identity-mismatch" class="last-error" style="color:var(--color-danger);background:var(--color-danger-muted);" hidden></div>

    <div id="export-expired-block" class="last-error" style="color:var(--color-danger);background:var(--color-danger-muted);" hidden></div>

    <div id="delete-gates-body">
      <div class="gate-list">
        <div class="download-row" id="delete-dump-link"></div>
        <div class="download-row" id="delete-openformat-link"></div>
      </div>
      <label class="checkbox-field" style="margin-top:var(--space-3);">
        <input type="checkbox" id="verify-checkbox" onchange="updateGates()">
        <span id="verify-checkbox-label"></span>
      </label>
      <div class="field" style="margin-top:var(--space-3);">
        <label id="delete-typed-label"></label>
        <input class="input" id="delete-typed-input" oninput="updateGates()" autocomplete="off">
      </div>
      <div class="gate-status" id="gate-status" role="status" aria-live="polite" style="margin-top:var(--space-2);"></div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')" data-i18n="tenants.destroy.cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn" aria-disabled="true" onclick="submitPermanentDelete()" data-i18n="tenants.offboarding.confirmDelete">Permanently delete</button>
    </div>
  </div>
</div>

<div class="demo-controls" style="max-width:270px;">
  <div class="title" data-i18n="tenants.demoPanelTitle">Prototype controls</div>
  <select class="input" id="scenario-select" onchange="render(this.value)">
    <option value="NotStarted">Not started (Active)</option>
    <option value="Suspended">Suspended</option>
    <option value="ExportingRunning">Exporting — running</option>
    <option value="ExportingReady">Exporting — both ready</option>
    <option value="PendingDeletionBefore" selected>Pending deletion — before eligible</option>
    <option value="PendingDeletionAfter">Pending deletion — eligible now</option>
    <option value="Deleted">Deleted</option>
  </select>
  <label style="font-size:11px;display:flex;gap:6px;align-items:center;">
    <input type="checkbox" id="simulate-expired"> Simulate expired export
  </label>
  <label style="font-size:11px;display:flex;gap:6px;align-items:center;">
    <input type="checkbox" id="simulate-delete-mismatch-open"> Simulate mismatch on 1st check (dialog open)
  </label>
  <label style="font-size:11px;display:flex;gap:6px;align-items:center;">
    <input type="checkbox" id="simulate-delete-mismatch-submit"> Simulate mismatch on 2nd check (at submit)
  </label>
  <button class="btn btn-secondary btn-sm" onclick="cycleConnectionDemo()">Cycle connection banner</button>
  <a class="btn btn-ghost btn-sm" href="index.html">← Back to index</a>
</div>
<div class="toast-stack"></div>

<script src="app.js"></script>
<script src="i18n.js"></script>
<script>
  // "Today," for the fictional PendingDeletion eligibility comparison this
  // demo needs — a real build compares against the actual clock server-side
  // (never client Date.now(), per this project's own rule against reading
  // the ambient clock from arbitrary code); this constant exists solely so
  // a static prototype can show "before" and "after" without one.
  var DEMO_TODAY = "2026-09-12";

  var TENANT = { name: "Meridian Distribution", key: "meridian-distribution" };

  var SCENARIOS = {
    NotStarted: { stage: 0 },
    Suspended: { stage: 1, suspendedAt: "2026-08-15 09:02", suspendedBy: "J. Alvarez" },
    ExportingRunning: {
      stage: 2, suspendedAt: "2026-08-15 09:02", suspendedBy: "J. Alvarez",
      bundles: [
        { key: "dump", labelKey: "tenants.offboarding.dumpBundle", status: "ready", expiresOn: "2026-08-22" },
        { key: "open", labelKey: "tenants.offboarding.openFormatBundle", status: "running", expiresOn: null }
      ]
    },
    ExportingReady: {
      stage: 2, suspendedAt: "2026-08-15 09:02", suspendedBy: "J. Alvarez",
      bundles: [
        { key: "dump", labelKey: "tenants.offboarding.dumpBundle", status: "ready", expiresOn: "2026-08-22" },
        { key: "open", labelKey: "tenants.offboarding.openFormatBundle", status: "ready", expiresOn: "2026-08-22" }
      ]
    },
    PendingDeletionBefore: {
      stage: 3, suspendedAt: "2026-08-15 09:02", suspendedBy: "J. Alvarez",
      bundles: [
        { key: "dump", labelKey: "tenants.offboarding.dumpBundle", status: "ready", expiresOn: "2026-09-22" },
        { key: "open", labelKey: "tenants.offboarding.openFormatBundle", status: "ready", expiresOn: "2026-09-22" }
      ],
      deletionDueDate: "2026-09-14"
    },
    PendingDeletionAfter: {
      stage: 3, suspendedAt: "2026-08-15 09:02", suspendedBy: "J. Alvarez",
      bundles: [
        { key: "dump", labelKey: "tenants.offboarding.dumpBundle", status: "ready", expiresOn: "2026-09-22" },
        { key: "open", labelKey: "tenants.offboarding.openFormatBundle", status: "ready", expiresOn: "2026-09-22" }
      ],
      deletionDueDate: "2026-09-10"
    },
    Deleted: { stage: 4, deletedAt: "2026-09-14", deletedBy: "J. Alvarez", backupExpiry: "2026-10-19" }
  };

  var currentScenario = "PendingDeletionBefore";

  function daysBetween(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }

  function render(name) {
    currentScenario = name;
    document.getElementById("scenario-select").value = name;
    var s = SCENARIOS[name];

    document.getElementById("back-link").href = "tenant-detail.html";
    document.getElementById("back-link").textContent = "← " + TENANT.name;
    document.getElementById("page-heading").textContent = t("tenants.offboarding.heading", { tenant: TENANT.name });
    document.title = t("tenants.offboarding.pageTitle", { tenant: TENANT.name });

    document.getElementById("intro-panel").hidden = s.stage !== 0;
    if (s.stage === 0) {
      document.getElementById("begin-btn").textContent = t("tenants.offboarding.beginAction", { tenant: TENANT.name });
    }

    renderStepper(s);
    renderStageContent(s);
  }

  var STAGE_LABEL_KEYS = ["", "tenants.offboarding.stageSuspended", "tenants.offboarding.stageExported", "tenants.offboarding.stagePendingDeletion", "tenants.offboarding.stageDeleted"];

  function renderStepper(s) {
    var el = document.getElementById("vstepper");
    el.innerHTML = "";
    for (var i = 1; i <= 4; i++) {
      var cls = i < s.stage ? "done" : (i === s.stage ? "current" : "upcoming");
      var row = document.createElement("div");
      row.className = "vstep " + cls;
      var dot = document.createElement("div");
      dot.className = "vdot";
      dot.textContent = i < s.stage ? "✓" : String(i);
      var body = document.createElement("div");
      body.className = "vbody";
      var label = document.createElement("div");
      label.className = "vlabel";
      label.textContent = t(STAGE_LABEL_KEYS[i]);
      body.appendChild(label);
      if (i < s.stage) {
        var meta = document.createElement("div");
        meta.className = "vmeta";
        meta.textContent = stageDoneSummary(i, s);
        body.appendChild(meta);
      }
      row.appendChild(dot);
      row.appendChild(body);
      el.appendChild(row);
    }
  }

  function stageDoneSummary(i, s) {
    if (i === 1) return s.suspendedAt + " · " + s.suspendedBy;
    if (i === 2) return t("tenants.offboarding.bothBundlesReady");
    if (i === 3) return "—";
    return "";
  }

  // Real <a href> when ready — SPEC-003-tenant-offboarding.md's keyboard
  // section requires a genuine link so a screen reader can reach and open
  // it, not a JS-only click handler. This prototype points at "#"; a real
  // build points at the signed, expiring download URL.
  function bundleRow(b) {
    var row = document.createElement("div");
    row.className = "download-row" + (b.status !== "ready" ? " pending" : "");
    if (b.status === "ready") {
      row.innerHTML = '✓ <a href="#" onclick="return false;"></a> — <span></span>';
      row.querySelector("a").textContent = t(b.labelKey);
      row.querySelector("span").textContent = t("tenants.offboarding.expiresOn", { date: formatDate(b.expiresOn) });
    } else {
      var icon = b.status === "failed" ? "⚠" : "⋯";
      row.textContent = icon + " " + t(b.labelKey) + " — " + b.status;
    }
    return row;
  }

  function renderStageContent(s) {
    var el = document.getElementById("stage-content");
    el.innerHTML = "";
    if (s.stage === 1) {
      var panel = document.createElement("div");
      panel.className = "panel";
      panel.style.padding = "var(--space-4)";
      var actions = document.createElement("div");
      actions.className = "actions-row";
      var resume = document.createElement("button");
      resume.className = "btn btn-secondary";
      resume.textContent = t("tenants.offboarding.resume");
      resume.onclick = function () { openConfirm("resume"); };
      var start = document.createElement("button");
      start.className = "btn btn-primary";
      start.textContent = t("tenants.offboarding.startExport");
      start.onclick = function () { openConfirm("startExport"); };
      actions.appendChild(resume);
      actions.appendChild(start);
      panel.appendChild(actions);
      el.appendChild(panel);
    } else if (s.stage === 2) {
      var p2 = document.createElement("div");
      p2.className = "panel section";
      p2.style.padding = "var(--space-4)";
      s.bundles.forEach(function (b) { p2.appendChild(bundleRow(b)); });
      var allReady = s.bundles.every(function (b) { return b.status === "ready"; });
      var cont = document.createElement("button");
      cont.className = "btn btn-primary";
      cont.style.marginTop = "var(--space-3)";
      cont.textContent = t("tenants.offboarding.continueAction");
      cont.setAttribute("aria-disabled", allReady ? "false" : "true");
      if (!allReady) {
        var reason = document.createElement("div");
        reason.style.cssText = "font-size:11px;color:var(--color-text-muted);margin-top:4px;";
        reason.textContent = t("tenants.offboarding.continueDisabledReason");
        p2.appendChild(cont);
        p2.appendChild(reason);
      } else {
        cont.onclick = function () { render("PendingDeletionBefore"); };
        p2.appendChild(cont);
      }
      el.appendChild(p2);
    } else if (s.stage === 3) {
      var due = document.createElement("div");
      due.className = "countdown-badge";
      var days = daysBetween(s.deletionDueDate, DEMO_TODAY);
      var eligible = days <= 0;
      // Once eligible there is nothing left to count down — the grace
      // period is over, not "0 days remaining" (which would read as if a
      // decrement were still running).
      due.textContent = eligible
        ? formatDate(s.deletionDueDate)
        : t("tenants.offboarding.daysRemaining", { days: formatCount(days) }) + " · " + formatDate(s.deletionDueDate);
      el.appendChild(due);

      var row = document.createElement("div");
      row.className = "panel-row";
      var safe = document.createElement("div");
      safe.className = "safe-panel";
      safe.innerHTML = "<h3></h3><p></p><button class='btn btn-secondary'></button>";
      safe.querySelector("h3").textContent = t("tenants.offboarding.cancelDeletion");
      safe.querySelector("p").textContent = t("tenants.offboarding.cancelDeletionBody");
      var cancelBtn = safe.querySelector("button");
      cancelBtn.textContent = t("tenants.offboarding.cancelDeletion");
      cancelBtn.onclick = function () { openConfirm("cancelDeletion"); };
      row.appendChild(safe);

      var danger = document.createElement("div");
      danger.className = "danger-zone";
      danger.innerHTML = "<h3></h3><p></p><button class='btn btn-danger'></button>";
      danger.querySelector("h3").textContent = t("tenants.dangerZoneHeading");
      var deleteBtn = danger.querySelector("button");
      deleteBtn.textContent = t("tenants.offboarding.permanentDeleteAction");
      if (!eligible) {
        deleteBtn.setAttribute("aria-disabled", "true");
        danger.querySelector("p").textContent = t("tenants.offboarding.notYetEligible", { date: formatDate(s.deletionDueDate) });
      } else {
        danger.querySelector("p").textContent = "";
        deleteBtn.onclick = openPermanentDeleteDialog;
      }
      row.appendChild(danger);
      el.appendChild(row);
    } else if (s.stage === 4) {
      var cert = document.createElement("div");
      cert.className = "panel cert-panel";
      cert.innerHTML = "<h2 style='font-size:var(--font-size-heading-sm);font-weight:600;margin-bottom:8px;'></h2><p></p>";
      cert.querySelector("h2").textContent = t("tenants.offboarding.certificateHeading");
      cert.querySelector("p").textContent = t("tenants.offboarding.certificateBody", {
        date: formatDate(s.deletedAt), actor: s.deletedBy, backupExpiry: formatDate(s.backupExpiry)
      });
      el.appendChild(cert);
    }
  }

  // --------------------- Light confirmations (stage 0/1/3 safe actions) --------------------
  var pendingConfirmKind = null;
  function openConfirm(kind) {
    pendingConfirmKind = kind;
    var title = "", body = "", submitLabel = "";
    if (kind === "begin") {
      title = t("tenants.offboarding.beginAction", { tenant: TENANT.name });
      body = t("tenants.offboarding.intro");
      submitLabel = t("tenants.offboarding.stageSuspended");
    } else if (kind === "resume") {
      title = t("tenants.offboarding.resume");
      body = t("tenants.offboarding.resumeBody", { tenant: TENANT.name });
      submitLabel = t("tenants.offboarding.resume");
    } else if (kind === "startExport") {
      title = t("tenants.offboarding.startExport");
      body = t("tenants.offboarding.startExportBody");
      submitLabel = t("tenants.offboarding.startExport");
    } else if (kind === "cancelDeletion") {
      title = t("tenants.offboarding.cancelDeletion");
      body = t("tenants.offboarding.cancelDeletionBody");
      submitLabel = t("tenants.offboarding.cancelDeletion");
    }
    document.getElementById("confirm-title").textContent = title;
    document.getElementById("confirm-body").textContent = body;
    document.getElementById("confirm-submit-btn").textContent = submitLabel;
    openModal("confirm-modal");
  }
  function submitConfirm() {
    closeModal("confirm-modal");
    if (pendingConfirmKind === "begin") { render("Suspended"); showToast("success", "Suspended. Offboarding started."); }
    else if (pendingConfirmKind === "resume") { showToast("success", TENANT.name + " resumed to Active."); setTimeout(function () { location.href = "tenant-detail.html"; }, 800); }
    else if (pendingConfirmKind === "startExport") { render("ExportingRunning"); showToast("info", "Export started."); }
    else if (pendingConfirmKind === "cancelDeletion") { showToast("success", "Deletion cancelled. Tenant restored to Active."); setTimeout(function () { location.href = "tenant-detail.html"; }, 800); }
  }

  // --------------------- Permanent-delete dialog (three gates) --------------------
  function openPermanentDeleteDialog() {
    document.getElementById("delete-title").textContent = t("tenants.offboarding.confirmDelete") + " — " + TENANT.name;
    document.getElementById("verify-checkbox").checked = false;
    document.getElementById("delete-typed-input").value = "";
    document.getElementById("delete-typed-label").textContent = t("tenants.offboarding.typeToConfirm", { key: TENANT.key });
    document.getElementById("export-expired-block").hidden = true;
    document.getElementById("delete-gates-body").hidden = true;
    document.getElementById("delete-identity-confirmed").hidden = true;
    document.getElementById("delete-identity-mismatch").hidden = true;
    var checking = document.getElementById("delete-identity-checking");
    checking.hidden = false;
    checking.textContent = "…";
    openModal("delete-modal");
    var mismatchFirst = document.getElementById("simulate-delete-mismatch-open").checked;
    setTimeout(function () {
      checking.hidden = true;
      if (mismatchFirst) {
        var m = document.getElementById("delete-identity-mismatch");
        m.hidden = false;
        m.textContent = t("tenants.destroy.identityMismatch", { key: TENANT.key });
        announce(m.textContent, true);
        return; // gates never reveal — nothing left in this dialog to satisfy
      }
      var c = document.getElementById("delete-identity-confirmed");
      c.hidden = false;
      c.textContent = t("tenants.destroy.identityConfirmed", { key: TENANT.key });
      announce(c.textContent, false);
      revealGates();
    }, 500);
  }
  function revealGates() {
    var s = SCENARIOS[currentScenario];
    var expired = document.getElementById("simulate-expired").checked;
    var block = document.getElementById("export-expired-block");
    var gatesBody = document.getElementById("delete-gates-body");
    if (expired) {
      block.hidden = false;
      block.textContent = t("tenants.offboarding.exportExpiredBlock");
      gatesBody.hidden = true;
      document.getElementById("confirm-delete-btn").setAttribute("aria-disabled", "true");
    } else {
      block.hidden = true;
      gatesBody.hidden = false;
      document.getElementById("delete-dump-link").innerHTML =
        '<a href="#" onclick="return false;">' + t("tenants.offboarding.dumpBundle") + "</a> — " + t("tenants.offboarding.expiresOn", { date: formatDate(s.bundles[0].expiresOn) });
      document.getElementById("delete-openformat-link").innerHTML =
        '<a href="#" onclick="return false;">' + t("tenants.offboarding.openFormatBundle") + "</a> — " + t("tenants.offboarding.expiresOn", { date: formatDate(s.bundles[1].expiresOn) });
      document.getElementById("verify-checkbox-label").textContent = t("tenants.offboarding.verifiedExportCheckbox", { timestamp: formatDate(s.bundles[0].expiresOn) });
      updateGates();
    }
  }
  function updateGates() {
    var expired = document.getElementById("simulate-expired").checked;
    var exportOk = !expired;
    var checked = document.getElementById("verify-checkbox").checked;
    var typedOk = document.getElementById("delete-typed-input").value === TENANT.key;
    var satisfied = (exportOk ? 1 : 0) + (checked ? 1 : 0) + (typedOk ? 1 : 0);
    var status = document.getElementById("gate-status");
    status.textContent = t("tenants.offboarding.gatesStatus", { satisfied: formatCount(satisfied) });
    status.className = "gate-status" + (satisfied === 3 ? " all-met" : "");
    document.getElementById("confirm-delete-btn").setAttribute("aria-disabled", satisfied === 3 ? "false" : "true");
  }
  // The identity check on open (above) only gates whether the three gates
  // are reachable — it is NOT what authorizes the drop. A SECOND,
  // independent identity check runs here, at act time, immediately before
  // the destroy command would be sent (SPEC-003-tenant-offboarding.md,
  // "Detection, not prevention"). "simulate-delete-mismatch-submit" proves
  // this is a real, separate round trip: ticking it makes the two checks
  // disagree even though every gate above was genuinely satisfied.
  function submitPermanentDelete() {
    var btn = document.getElementById("confirm-delete-btn");
    if (btn.getAttribute("aria-disabled") === "true") return;
    btn.setAttribute("aria-disabled", "true");
    var priorLabel = btn.textContent;
    btn.textContent = "…";
    var mismatchAtSubmit = document.getElementById("simulate-delete-mismatch-submit").checked;
    setTimeout(function () {
      if (mismatchAtSubmit) {
        document.getElementById("delete-gates-body").hidden = true;
        document.getElementById("delete-identity-confirmed").hidden = true;
        var m = document.getElementById("delete-identity-mismatch");
        m.hidden = false;
        m.textContent = t("tenants.destroy.identityMismatch", { key: TENANT.key });
        announce(m.textContent, true);
        btn.hidden = true;
        return;
      }
      closeModal("delete-modal");
      render("Deleted");
      showToast("success", t("tenants.offboarding.successToast", { tenant: TENANT.name }));
    }, 500);
  }

  document.addEventListener("DOMContentLoaded", function () { render("PendingDeletionBefore"); });
</script>
</body>
</html>
